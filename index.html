<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rachel Schneider</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #72919d;
      background-image: url('assets/business-card.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      overflow: hidden;
    }

    /* Full-screen link — clicking anywhere goes to home.html */
    .cover-link {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 3rem;
      text-decoration: none;
    }

    .welcome {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(245, 234, 216, 0.75);
      animation: fadein 2s ease 0.8s both, pulse 3s ease-in-out 3s infinite;
      user-select: none;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>

  <a href="home.html" class="cover-link" aria-label="Enter site">
    <span class="welcome">WELCOME &mdash; CLICK TO ENTER</span>
  </a>

</body>
</html>
