<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rachel Schneider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: #72919d;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    /* Equal flex spacers above and below keep the card vertically centred */
    .spacer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Centred composition ────────────────────────────── */
    .splash {
      position: relative;
      /* Never exceed native PNG res (2016px) — always sharp.
         min() picks the tightest constraint: width, height-derived, or hard cap. */
      width: min(860px, 90vw, calc(88vh * 1.75));
      animation: fadein 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    /* The botanical art — transparent PNG, drops straight onto the blue */
    .floral {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    /* Name + title sit centred over the art, just like the business card */
    .name-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(1.4rem, 4.8vw, 3.6rem);
      letter-spacing: 0.42em;
      text-indent: 0.42em;   /* offset trailing gap */
      text-transform: uppercase;
      color: #f0e8d6;
      line-height: 1.0;
      white-space: nowrap;
    }

    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(0.42rem, 1.35vw, 1rem);
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      color: rgba(240, 232, 214, 0.68);
      margin-top: 0.6em;
      white-space: nowrap;
    }

    /* ── Welcome prompt ─────────────────────────────────── */
    .welcome {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      text-transform: uppercase;
      color: rgba(240, 232, 214, 0.62);
      white-space: nowrap;
      pointer-events: none;
      animation: fadein 2.2s ease 1s both, pulse 3.5s ease-in-out 3s infinite;
    }

    /* Full-screen invisible click target */
    .cover-link {
      position: fixed;
      inset: 0;
      z-index: 10;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.62; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="spacer"></div>

  <div class="splash">
    <!-- Transparent PNG — no edges, no rectangle, pure art on blue -->
    <img
      class="floral"
      src="assets/background-flower.png"
      alt=""
      aria-hidden="true"
    >
    <!-- Text layered on top, matching the card layout -->
    <div class="name-block">
      <p class="name">Rachel Schneider</p>
      <p class="title">Policy Analyst &amp; Researcher</p>
    </div>
  </div>

  <!-- Welcome sits centred in the lower spacer -->
  <div class="spacer">
    <p class="welcome">WELCOME &mdash; CLICK TO ENTER</p>
  </div>

  <a href="home.html" class="cover-link" aria-label="Enter site"></a>

</body>
</html>
