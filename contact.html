<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Rachel Schneider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cormorant+Garamond:wght@300;400&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --beige:       #d4cbb8;
      --beige-deep:  #c3baaa;
      --beige-light: #e2dbd0;
      --slate:       #72919d;
      --slate-dark:  #3f5760;
      --slate-deep:  #2d3d45;
      --olive:       #939c73;
      --cream:       #f5ead8;
      --radius:      18px;
      --nav-h:       72px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--beige-light);
      color: var(--slate-deep);
      font-family: 'Figtree', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--slate);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 clamp(1.5rem, 6vw, 5rem);
      height: var(--nav-h);
    }
    .nav-links { display: flex; gap: clamp(1.2rem, 3vw, 2.5rem); list-style: none; }
    .nav-links a {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.6;
      text-decoration: none;
      transition: opacity 0.18s;
    }
    .nav-links a:hover, .nav-links a[aria-current] { opacity: 1; }

    /* ── Hero strip ── */
    .contact-hero {
      background: var(--slate-dark);
      padding: 5rem clamp(2rem, 8vw, 8rem) 4.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .contact-hero .hero-flower {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 151%;
      max-width: 972px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .contact-hero .label,
    .contact-hero h1,
    .contact-hero p { position: relative; z-index: 1; }
    .contact-hero .label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,234,216,0.5);
      margin-bottom: 1rem;
    }
    .contact-hero h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.8rem, 5vw, 4.5rem);
      line-height: 1.05;
      color: var(--cream);
      margin-bottom: 1.1rem;
    }
    .contact-hero p {
      font-size: 1rem;
      color: rgba(245,234,216,0.6);
      max-width: 38ch;
      margin: 0 auto;
    }

    /* ── Cards ── */
    .contact-cards {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem clamp(1.5rem, 6vw, 4rem);
      gap: 1.25rem;
    }

    .contact-card {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      width: 100%;
      max-width: 520px;
      background: var(--cream);
      border: 1px solid rgba(63,87,96,0.1);
      border-radius: var(--radius);
      padding: 1.75rem 2rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 2px 12px rgba(45,61,69,0.07);
    }
    .contact-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(45,61,69,0.13);
    }
    .contact-card:active { transform: translateY(0); }

    .card-icon {
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--slate-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
    }
    .card-icon svg { width: 22px; height: 22px; }

    .card-text { flex: 1; }
    .card-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 0.2rem;
    }
    .card-value {
      font-family: 'Caprasimo', serif;
      font-weight: 400;
      font-size: 1rem;
      color: var(--slate-deep);
    }

    .card-arrow {
      color: var(--slate);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      background: var(--slate-deep);
      padding: 2.5rem clamp(2rem, 8vw, 6rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .footer-brand {
      font-family: 'Caprasimo', serif;
      font-size: 1rem;
      color: var(--cream);
      opacity: 0.8;
    }
    .footer-links { display: flex; gap: 1.5rem; list-style: none; }
    .footer-links a {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.4;
      text-decoration: none;
      transition: opacity 0.18s;
    }
    .footer-links a:hover { opacity: 0.9; }
    .footer-copy { font-size: 0.75rem; color: var(--cream); opacity: 0.25; width: 100%; }

    @media (max-width: 600px) {
      .contact-card { padding: 1.4rem 1.5rem; gap: 1.25rem; }
      .footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  </main>

  <footer class="footer">
    <span class="footer-brand">Rachel Schneider</span>
    <img src="assets/Gold-flower.png" alt="" aria-hidden="true" style="width:120px;opacity:0.6;">
